name: Windows checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-install-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install locked source dependencies on the disposable runner
        run: |
          ./bootstrap.ps1
          ./.venv/Scripts/python.exe -m pip install --constraint requirements.lock --requirement requirements.push.lock --requirement requirements.faces.lock
          if ($LASTEXITCODE -ne 0) { throw 'Optional test dependency installation failed.' }
      - name: Install checksum-verified media tools on the disposable runner
        run: ./scripts/install-ffmpeg.ps1
      - name: Check all Python sources and scripts
        run: |
          ./.venv/Scripts/python.exe -m ruff check services tests scripts
          if ($LASTEXITCODE -ne 0) { throw 'Ruff failed.' }
      - name: Test Python, strict types, production build and four browser widths
        run: ./test.ps1 -Browser
      - name: Verify generated API contracts are committed
        run: |
          git diff --exit-code -- apps/web/openapi.json apps/web/src/lib/api-schema.ts
          if ($LASTEXITCODE -ne 0) { throw 'Generated API contracts changed.' }
