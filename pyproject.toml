[build-system]
requires = ["setuptools>=84,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "porchlight"
version = "0.1.0"
description = "A local-first Blink camera companion"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Kevin DeMara"}]
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.142,<0.143", "uvicorn>=0.54,<0.55",
  "SQLAlchemy>=2.1,<2.2", "alembic>=1.20,<1.21",
  "pydantic-settings>=2.15,<2.16", "argon2-cffi>=25,<26",
  "portalocker>=4.4,<4.5", "httpx>=0.28,<0.29", "tzdata>=2026.5",
  "jsonschema>=4.26,<4.27",
  "blinkpy==0.25.9", "pywin32==312; sys_platform == 'win32'",
]

[tool.setuptools.packages.find]
where = ["services"]

[tool.setuptools.package-data]
porchlight = ["storage/migrations/*.py", "storage/migrations/versions/*.py", "face_model.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["services"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["services/porchlight"]

[[tool.mypy.overrides]]
module = ["blinkpy.*", "win32crypt"]
ignore_missing_imports = true
